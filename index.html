<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام المحاسبي السحابي</title>
    <!-- ربط ملف الـ Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <!-- استخدام Tailwind CSS لتصميم سريع واحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- شاشة تسجيل الدخول (تظهر لو المستخدم مش مسجل دخوله) -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gray-100">
        <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-indigo-600">🔐 تسجيل الدخول للنظام</h2>
                <p class="text-sm text-gray-500 mt-1">أدخل بياناتك للوصول إلى لوحة التحكم</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">اسم المستخدم أو البريد</label>
                    <input type="text" id="login-user" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="أدخل اسم المستخدم...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">كلمة المرور</label>
                    <input type="password" id="login-pass" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">دخول للنظام</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية (تظهر بعد تسجيل الدخول) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- شريط العرض العلوي -->
        <header class="bg-indigo-600 text-white shadow-md">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <h1 class="text-xl font-bold">📊 النظام المحاسبي</h1>
                    <span class="bg-indigo-700 text-xs px-3 py-1 rounded-full hidden sm:inline-block">متصل بالسحابة</span>
                </div>
                <div class="flex items-center space-x-3 space-x-reverse">
                    <span id="user-display" class="text-sm font-medium"></span>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-lg transition shadow-sm">تسجيل خروج 🚪</button>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 py-6 max-w-4xl flex-grow">
            <!-- إحصائيات سريعة -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">إجمالي أصناف المخزن</p>
                        <h3 id="total-items" class="text-2xl font-bold text-indigo-600">0</h3>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-lg text-indigo-600">📦</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500">إجمالي قيمة المخزن</p>
                        <h3 id="total-value" class="text-2xl font-bold text-emerald-600">0.00 ر.س</h3>
                    </div>
                    <div class="bg-emerald-50 p-3 rounded-lg text-emerald-600">💰</div>
                </div>
            </div>

            <!-- فورم إضافة منتج جديد -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
                <h2 class="text-lg font-bold mb-4 text-gray-700 border-b pb-2">➕ إضافة منتج جديد للمخزن</h2>
                
                <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">كود المنتج</label>
                        <input type="text" id="code" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="أدخل الكود...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">اسم المنتج</label>
                        <input type="text" id="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="أدخل اسم المنتج...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">سعر الشراء</label>
                        <input type="number" step="0.01" id="buy-price" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">سعر البيع</label>
                        <input type="number" step="0.01" id="sell-price" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.00">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-600 mb-1">الكمية المتاحة</label>
                        <input type="number" id="qty" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0">
                    </div>
                    <div class="md:col-span-2 mt-2">
                        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">حفظ المنتج في المخزن</button>
                    </div>
                </form>
            </div>

            <!-- جدول عرض المنتجات -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 overflow-hidden">
                <h2 class="text-lg font-bold mb-4 text-gray-700 border-b pb-2">📋 قائمة المنتجات المسجلة</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-600 text-sm">
                                <th class="p-3">الكود</th>
                                <th class="p-3">المنتج</th>
                                <th class="p-3">الشراء</th>
                                <th class="p-3">البيع</th>
                                <th class="p-3">الكمية</th>
                                <th class="p-3">إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="divide-y divide-gray-100 text-sm">
                            <tr><td colspan="6" class="text-center py-6 text-gray-400">لا توجد منتجات مسجلة حتى الآن</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- سكريبت إدارة الجلسات والحسابات -->
    <script>
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const userDisplay = document.getElementById('user-display');

        // التحقق من حالة تسجيل الدخول عند فتح الصفحة
        function checkAuth() {
            const currentUser = localStorage.getItem('accounting_logged_user');
            if (currentUser) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                userDisplay.innerText = `مرحباً، ${currentUser}`;
                renderTable();
            } else {
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        }

        // تسجيل الدخول
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('login-user').value;
            localStorage.setItem('accounting_logged_user', username);
            checkAuth();
        });

        // تسجيل الخروج
        window.logout = function() {
            localStorage.removeItem('accounting_logged_user');
            checkAuth();
        }

        // إدارة المنتجات والمخزن
        let products = JSON.parse(localStorage.getItem('accounting_products')) || [];
        const form = document.getElementById('product-form');
        const tableBody = document.getElementById('product-table-body');
        const totalItemsEl = document.getElementById('total-items');
        const totalValueEl = document.getElementById('total-value');

        function renderTable() {
            tableBody.innerHTML = '';
            if (products.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">لا توجد منتجات مسجلة حتى الآن</td></tr>`;
                totalItemsEl.innerText = '0';
                totalValueEl.innerText = '0.00 ر.س';
                return;
            }

            let totalVal = 0;
            products.forEach((p, index) => {
                totalVal += (p.buyPrice * p.qty);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-3 font-mono text-gray-600">${p.code}</td>
                    <td class="p-3 font-medium">${p.name}</td>
                    <td class="p-3">${p.buyPrice}</td>
                    <td class="p-3">${p.sellPrice}</td>
                    <td class="p-3">${p.qty}</td>
                    <td class="p-3">
                        <button onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">حذف</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            totalItemsEl.innerText = products.length;
            totalValueEl.innerText = totalVal.toFixed(2) + ' ر.س';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const newProduct = {
                code: document.getElementById('code').value,
                name: document.getElementById('name').value,
                buyPrice: parseFloat(document.getElementById('buy-price').value),
                sellPrice: parseFloat(document.getElementById('sell-price').value),
                qty: parseInt(document.getElementById('qty').value)
            };

            products.push(newProduct);
            localStorage.setItem('accounting_products', JSON.stringify(products));
            form.reset();
            renderTable();
        });

        window.deleteProduct = function(index) {
            products.splice(index, 1);
            localStorage.setItem('accounting_products', JSON.stringify(products));
            renderTable();
        }

        // تشغيل فحص المصادقة عند التحميل
        checkAuth();
    </script>
</body>
</html>
